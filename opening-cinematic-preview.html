<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triple Y · 开屏特效预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; background:#1a1b2e; }

  /* === 开屏场景：书桌氛围 === */
  .scene {
    position: fixed; inset:0; z-index: 100;
    background: linear-gradient(180deg, #2a2d5e 0%, #4a3f7a 40%, #6b5a9e 70%, #8b7ec8 100%);
    transition: opacity 1s ease;
  }
  .scene.fade-out { opacity: 0; pointer-events:none; }

  /* 台灯暖光 */
  .lamp-glow {
    position: absolute; top:-10%; left:50%; transform:translateX(-50%);
    width: 600px; height: 400px;
    background: radial-gradient(ellipse, rgba(255,220,150,.35) 0%, transparent 70%);
  }
  /* 桌面 */
  .desk {
    position: absolute; bottom:0; left:0; right:0; height:30%;
    background: linear-gradient(180deg, #5a4a7a 0%, #3a2f5a 100%);
  }
  /* 书本/笔记本剪影 */
  .book { position:absolute; bottom:22%; left:20%; width:120px; height:16px; background:#8b7ec8; border-radius:2px; }
  .book2 { position:absolute; bottom:24%; left:22%; width:100px; height:14px; background:#6b5a9e; border-radius:2px; }
  .cup { position:absolute; bottom:22%; right:25%; width:40px; height:50px; background:#a89ee8; border-radius:4px 4px 8px 8px; }

  /* Triple Y 文字 */
  .splash-logo {
    position:absolute; top:45%; left:50%; transform:translate(-50%,-50%);
    color:#fff; font-size:64px; font-weight:900; letter-spacing:4px;
    opacity:0;
    animation: logoIn 1.2s ease forwards, logoZoom 1.5s ease 2.5s forwards;
  }
  .splash-sub {
    position:absolute; top:55%; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,.7); font-size:16px; letter-spacing:2px;
    opacity:0; animation: subIn 1s ease 3s forwards;
  }
  @keyframes logoIn { to { opacity:1; } }
  @keyframes logoZoom {
    0% { transform:translate(-50%,-50%) scale(1); opacity:1; }
    100% { transform:translate(-50%,-50%) scale(1.4); opacity:0; }
  }
  @keyframes subIn { to { opacity:1; } }

  /* 镜头下移 */
  .scene.move-down { animation: moveDown 1.2s ease 4s forwards; }
  @keyframes moveDown {
    to { transform: translateY(30vh); opacity:0; }
  }

  /* === 主页面（虚化背景） === */
  .main {
    position: fixed; inset:0; z-index:1;
    background: linear-gradient(135deg, #e8e4ff 0%, #fff0e6 50%, #dceeff 100%);
    filter: blur(20px); transform: scale(1.05);
  }
  .main-content {
    position: fixed; inset:0; z-index:2; padding:24px;
    opacity:0; animation: contentIn .8s ease 4.5s forwards;
  }
  @keyframes contentIn { to { opacity:1; } }
  .card { background:rgba(255,255,255,.85); backdrop-filter:blur(10px); border-radius:14px; padding:18px; box-shadow:0 4px 20px rgba(120,110,200,.1); margin-bottom:14px; }
  .topbar h1 { color:#2d2a5e; font-size:20px; margin-bottom:16px; }
</style>
</head>
<body>

  <div class="main"></div>
  <div class="main-content">
    <div class="topbar"><h1>Triple Y · 通知转任务</h1></div>
    <div class="card"><b>✍️ 输入通知</b><div style="color:#999;font-size:13px;margin-top:8px">粘贴一段通知原文…</div></div>
    <div class="card"><b>📋 任务清单</b><div style="color:#999;font-size:13px;margin-top:8px">这里是你的任务列表</div></div>
  </div>

  <div class="scene move-down" id="scene">
    <div class="lamp-glow"></div>
    <div class="book"></div>
    <div class="book2"></div>
    <div class="cup"></div>
    <div class="desk"></div>
    <div class="splash-logo">Triple Y</div>
    <div class="splash-sub">粘贴一段通知，剩下的我帮你记着</div>
  </div>

<script>
  setTimeout(() => {
    document.getElementById('scene').classList.add('fade-out')
    setTimeout(() => document.getElementById('scene').remove(), 1000)
  }, 5200)
</script>
</body>
</html>
