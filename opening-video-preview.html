<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triple Y · 开屏</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; background:#1a1b2e; }
  .scene { position:fixed; inset:0; z-index:100; }
  .scene video { width:100%; height:100%; object-fit:cover; }
  .scene.fade { opacity:0; transition: opacity 1.2s ease; pointer-events:none; }
  .logo {
    position:absolute; top:45%; left:50%; transform:translate(-50%,-50%);
    color:#fff; font-size:80px; font-weight:900; letter-spacing:6px;
    text-shadow: 0 4px 40px rgba(0,0,0,.5);
    opacity:0;
    animation: logoIn 1.2s ease 2.5s forwards, logoOut 1s ease 4.5s forwards;
  }
  .sub {
    position:absolute; top:57%; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,.9); font-size:18px; letter-spacing:3px;
    opacity:0; animation: subIn 1s ease 3.2s forwards, subOut 1s ease 4.5s forwards;
  }
  @keyframes logoIn { to { opacity:1; } }
  @keyframes logoOut { to { opacity:0; transform:translate(-50%,-50%) scale(1.3); } }
  @keyframes subIn { to { opacity:1; } }
  @keyframes subOut { to { opacity:0; } }
  .main { position:fixed; inset:0; z-index:1; background: linear-gradient(135deg,#e8e4ff,#fff0e6,#dceeff); filter: blur(15px); transform: scale(1.05); }
  .content { position:fixed; inset:0; z-index:2; padding:24px; opacity:0; animation: contentIn 1s ease 5s forwards; }
  @keyframes contentIn { to { opacity:1; } }
  .card { background:rgba(255,255,255,.85); border-radius:14px; padding:18px; margin-bottom:14px; }
  h1 { color:#2d2a5e; margin-bottom:16px; }
</style>
</head>
<body>
  <div class="main"></div>
  <div class="content">
    <h1>Triple Y · 通知转任务</h1>
    <div class="card"><b>✍️ 输入通知</b><div style="color:#999;margin-top:8px">粘贴一段通知原文…</div></div>
    <div class="card"><b>📋 任务清单</b><div style="color:#999;margin-top:8px">这里是你的任务列表</div></div>
  </div>

  <div class="scene" id="scene">
    <video src="scene_clean.mp4" autoplay muted playsinline></video>
    <div class="logo">Triple Y</div>
    <div class="sub">粘贴一段通知，剩下的我帮你记着</div>
  </div>

<script>
  setTimeout(() => document.getElementById('scene').classList.add('fade'), 5800)
</script>
</body>
</html>
