<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Triple Y 开屏动画预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#8b86e8; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; height:100vh; }
  .splash {
    position:fixed; inset:0;
    background:radial-gradient(circle at 50% 40%, #a5a0f0 0%, #8b86e8 60%, #6f68d8 100%);
    display:flex; align-items:center; justify-content:center;
    animation: out 0.8s ease 2.4s forwards;
  }
  .logo {
    color:#fff; font-size:88px; font-weight:800; letter-spacing:2px;
    opacity:0; transform:scale(0.8);
    animation: in 1.2s cubic-bezier(.2,.8,.2,1) forwards;
    text-shadow:0 8px 40px rgba(255,255,255,.25);
  }
  .sub {
    position:absolute; bottom:18%; color:rgba(255,255,255,.75); font-size:14px;
    opacity:0; animation: in 1s ease 0.6s forwards;
  }
  @keyframes in { to { opacity:1; transform:scale(1); } }
  @keyframes out { to { opacity:0; visibility:hidden; } }
</style>
</head>
<body>
  <div class="splash">
    <div class="logo">Triple Y</div>
    <div class="sub">让每一份通知都变成稳稳的任务</div>
  </div>
</body>
</html>
